import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingFile = rootProject.file('../../keystores/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def signingValue = { name, names -> names.collect { System.getenv(it) }.find { it } ?: signingProperties.getProperty(name) }
def releaseStore = signingValue('storeFile', ['KEYSTORE_FILE', 'ANDROID_KEYSTORE_PATH', 'REATER_KEYSTORE_FILE'])
def releaseStorePassword = signingValue('storePassword', ['KEYSTORE_PASSWORD', 'ANDROID_KEYSTORE_PASSWORD', 'REATER_STORE_PASS'])
def releaseAlias = signingValue('keyAlias', ['KEY_ALIAS', 'ANDROID_KEY_ALIAS', 'REATER_KEY_ALIAS'])
def releaseKeyPassword = signingValue('keyPassword', ['KEY_PASSWORD', 'ANDROID_KEY_PASSWORD', 'REATER_KEY_PASS'])
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } &&
    (!releaseStore || !releaseStorePassword || !releaseAlias || !releaseKeyPassword)) {
    throw new GradleException('Release signing requires environment variables or central keystores/signing.properties')
}


def packageJsonFile = file('../../package.json')
def packageJson = new JsonSlurper().parseText(packageJsonFile.text)
def appVersionName = packageJson.version

// Generate integer versionCode automatically from SemVer (e.g., 0.1.2 -> 0*10000 + 1*100 + 2 = 102)
def parseVersionCode(String version) {
    def parts = version.tokenize('.')
    def major = parts.size() > 0 ? parts[0].toInteger() : 0
    def minor = parts.size() > 1 ? parts[1].toInteger() : 0
    def patch = parts.size() > 2 ? parts[2].toInteger() : 0
    return major * 10000 + minor * 100 + patch
}

def appVersionCode = parseVersionCode(appVersionName)

android {
    namespace = "com.jimmy.nvidiapatch.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jimmy.nvidiapatch.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        archivesBaseName = "NvidiaPatch"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
        signingConfigs {
        release {
            if (releaseStore) storeFile file(releaseStore)
            storePassword releaseStorePassword
            keyAlias releaseAlias
            keyPassword releaseKeyPassword
        }
    }
    buildTypes {
        debug {

        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "NvidiaPatch-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

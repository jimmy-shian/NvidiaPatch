name: Build and Release Mobile APK

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test -- --run

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Load release signing references
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEY_BASE64:?Missing KEYSTORE_BASE64}"
          : "${SIGNING_STORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${SIGNING_KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${SIGNING_KEY_PASSWORD:?Missing KEY_PASSWORD}"
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release-key.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build Android APKs (Release & Debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease assembleDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NvidiaPatch-Mobile-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NvidiaPatch-Mobile-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release and Attach APKs
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mobile Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-ci-test-') }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
